<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf5e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10201a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="ذِكري — لحظات ذكر، وسكينة تتجدد. موقع عربي لأذكار الصباح والمساء مع مسبحة تفاعلية، ومتابعة التقدم، ومراجع موثقة."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" type="image/png" href="./icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ذِكري — أذكار الصباح والمساء</title>
    <script>
      // تطبيق الثيم قبل أول رسم للشاشة لتجنّب الوميض، حتى لو تعطل JavaScript الباقي.
      (function () {
        try {
          var stored = localStorage.getItem("dhikri:settings:v1");
          var theme = stored ? JSON.parse(stored).theme : null;
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* التخزين غير متاح — نعتمد الوضع الفاتح */
        }
      })();
    </script>
    <!-- مكتبة Supabase — لخدمة «ملاحظاتي» الاختيارية وحدها (دخول برابط سحري).
         وسم CDN مثبَّت بإصدار 2.118.0 كما طُلب؛ يُخزَّن بأول تحميل عبر عامل
         الخدمة فيعمل دون اتصال، وغيابه لا يُعطّل الموقع لأن الواجهة تفحصه
         عند الاستخدام فتعرض حالة صادقة. لا مفتاح سري هنا ولا في أي مكان —
         إعداد المشروع يأتي من متغيّرات البيئة أثناء البناء. -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      هذا الموقع يحتاج تفعيل JavaScript ليعمل. يمكنك قراءة نصوص الأذكار بعد تفعيله من إعدادات المتصفح.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
